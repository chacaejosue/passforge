<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">PassForge — Generador de contraseñas en Python</title>
  <desc id="description">Portada de PassForge con el emblema de escudo y chispa de forja sobre un fondo crema suave y tipografía moderna en tonos oscuros.</desc>

  <defs>
    <!-- Fondo suave en tono crema / piedra cálida (sin blanco puro) -->
    <linearGradient id="creamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="50%" stop-color="#F5F3EC"/>
      <stop offset="100%" stop-color="#ECE9DF"/>
    </linearGradient>

    <!-- Halo ambiental suave de forja en el centro -->
    <radialGradient id="ambientAura" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#0EA5A5" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Borde exterior de la armadura del escudo -->
    <linearGradient id="shieldRim" x1="14" y1="12" x2="114" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5A5"/>
    </linearGradient>

    <!-- Destello de la chispa central -->
    <linearGradient id="sparkGlow" x1="42" y1="40" x2="86" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#00E5BE"/>
      <stop offset="100%" stop-color="#0EA5A5"/>
    </linearGradient>

    <!-- Sombra sutil y natural sobre fondo crema -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Lienzo principal con esquinas redondeadas y borde sutil -->
  <rect x="2" y="2" width="1596" height="516" rx="30" fill="url(#creamBg)" stroke="#E2DED5" stroke-width="2.5" />
  <rect x="2" y="2" width="1596" height="516" rx="30" fill="url(#ambientAura)" />

  <!-- Emblema Central: Escudo Autónomo PassForge -->
  <g transform="translate(726, 95) scale(1.15)" filter="url(#emblemShadow)">
    <!-- Faceta Izquierda de la Placa (Pizarra medianoche) -->
    <path d="M 64 22 L 42 12 L 14 28 L 14 68 C 14 96 38 116 64 122 Z" fill="#0B132B"/>
    <!-- Faceta Derecha de la Placa (Pizarra grafito) -->
    <path d="M 64 22 L 86 12 L 114 28 L 114 68 C 114 96 90 116 64 122 Z" fill="#1E293B"/>
    <!-- Borde de Armadura Esculpido Autónomo -->
    <path d="M 64 22 L 86 12 L 114 28 L 114 68 C 114 96 90 116 64 122 C 38 116 14 96 14 68 L 14 28 L 42 12 Z" fill="none" stroke="url(#shieldRim)" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="64" y1="23" x2="64" y2="120" stroke="url(#shieldRim)" stroke-width="2" stroke-opacity="0.35"/>
    <!-- Chispa de la Forja -->
    <path d="M 64 40 Q 64 62 86 62 Q 64 62 64 84 Q 64 62 42 62 Q 64 62 64 40 Z" fill="url(#sparkGlow)"/>
    <circle cx="64" cy="62" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Tipografía de marca en tonos oscuros con acento en Forge -->
  <text x="800" y="328" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" text-anchor="middle" letter-spacing="-0.03em">
    <tspan fill="#0F172A">Pass</tspan><tspan fill="#0D9488">Forge</tspan>
  </text>

  <!-- Subtítulo refinado en gris pizarra -->
  <text x="800" y="372" fill="#526077" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="middle" letter-spacing="-0.01em">
    Generador de contraseñas de alta entropía en Python
  </text>
</svg>