[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passforge-backend"
version = "0.1.0"
description = "Secure password generator API built with Flask"
requires-python = ">=3.9"
dependencies = [
    "Flask==3.1.3",
    "gunicorn==23.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
